# TD3 on LunarLanderContinuous-v3. Same table as lunarlander_ddpg.yaml.
# The three TD3 flags are the only difference (spec.md section 3).
# Override seed/steps through run.py arguments.
agent: td3
env: lunarlander
environment_name: LunarLanderContinuous-v3
seed: 0
steps: 300000
gamma: 0.99
eval_every: 5000
eval_episodes: 5
actor_lr: 0.0003
critic_lr: 0.0003
tau: 0.005
replay_capacity: 1000000
batch_size: 256
hidden_dims: [256, 256]
exploration_std: 0.1
warmup_steps: 10000
policy_delay: 2
target_noise_std: 0.2
target_noise_clip: 0.5
