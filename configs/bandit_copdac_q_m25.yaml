# COPDAC-Q on the quadratic bandit, m = 25 (spec.md 1.4, paper section 5.1).
agent: copdac_q
env: bandit
seed: 0            # overridden by --seed
steps: 10000
gamma: 0.99        # unused on the bandit (one-step cost)
action_dim: 25
eval_every: 50     # one evaluation per batch of 2m steps
batch_size: 50     # critic least-squares refit every 2m steps
actor_lr: 0.1
sigma_beta: 0.1
natural_gradient: false
# Sweep, seed 0, 10,000 steps, final mean-action cost (sigma_beta = 0.1):
#   actor_lr 0.05 -> 0.30, 0.1 -> 0.016, 0.3 -> 0.036, 0.5 -> 0.069
# sigma_beta = 1.0 was worse at every actor_lr and every m.
