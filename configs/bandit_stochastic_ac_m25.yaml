# Stochastic Actor-Critic (Gaussian) on the quadratic bandit, m = 25
# (spec.md 1.2, paper section 5.1). On-policy baseline: no sigma_beta, no critic_lr.
agent: stochastic_ac
env: bandit
seed: 0            # overridden by --seed
steps: 10000
gamma: 0.99        # unused on the bandit (one-step cost)
action_dim: 25
eval_every: 50     # one evaluation per batch of 2m steps
batch_size: 50     # critic least-squares refit every 2m steps
actor_lr: 0.04
init_log_std: 0.0  # start at std = 1
# Stability-aware sweep (worst final cost across seeds 0-4, 10,000 steps):
#   actor_lr 0.01 -> 13.0, 0.02 -> 5.97, 0.03 -> 2.75, 0.04 -> 1.26,
#   0.05 -> DIVERGES (seed 2 blows up to ~1e75; the 1/var score term explodes
#   the mean step once the policy std collapses before theta converges).
# 0.04 is the largest step size that stays stable on every seed, so it is chosen
# here instead of the COPDAC-Q lr of 0.05. A seed-0-only sweep would have missed
# the seed-2 divergence.
